# media-server example configuration.
# Copy to media-server.toml (gitignored) and edit — the live config is
# yours and never conflicts with a git pull.
# db_path defaults to ~/Library/Application Support/mediaserver/media.db —
# matches the scanner. Run the scanner at least once before the server.

# Listen on all interfaces so LAN clients (TVs, VLC, BubbleUPnP) can reach us.
bind = "0.0.0.0:8200"

# LAN IP advertised to UPnP clients; auto-detected when unset.
#advertise_ip = "192.168.1.10"

friendly_name = "Home Media Server"

# Multi-homed hosts (e.g. wired + wifi on different networks): SSDP is
# announced on every non-loopback IPv4 interface by default, each
# announcement pointing clients at the canonical advertise_ip. List
# interfaces explicitly to restrict:
#ssdp_addrs = ["192.168.1.42", "10.0.0.5"]

# How many items each "Recently Added" view lists (Movies, TV Shows, Music).
recent_count = 25

# Seconds between periodic SSDP alive announcements (each sent twice per
# cycle). Lower helps clients on lossy links (wifi) discover the server
# sooner; 120 is a good balance.
ssdp_alive_secs = 120

# Devices whose multicast reception is unreliable (some Apple TVs, TVs
# behind fussy routers) can be sent every announcement directly: unicast
# UDP is acknowledged on wifi and immune to router multicast handling.
# Give listed devices a DHCP reservation so the address stays true.
#ssdp_unicast_clients = ["192.168.1.50"]
