# media-scanner example configuration.
# Copy to media-scanner.toml (gitignored) and edit — the live config is
# yours and never conflicts with a git pull. New options appear here;
# adopt them into your copy as needed.
# Database lives on the internal disk (default path) — SQLite WAL is
# unreliable on external/network volumes:
#   ~/Library/Application Support/mediaserver/media.db

# Watcher debounce: filesystem events are coalesced in windows of this length.
settle_ms = 2000

# How long a new file's size and mtime must hold still before it is probed
# and catalogued. Generous on purpose: network copies stall for seconds at a
# time, and probing a half-copied file catalogues it without its duration.
settle_secs = 30

# Full reconcile pass every N hours. Kept short because FSEvents on an
# SMB-mounted share are unreliable; the reconcile is the backstop.
reconcile_interval_hours = 1

ffprobe_path = "ffprobe"

# Automatic "skip intro / skip credits" detection: episodes of a season
# share nearly identical intro and credits audio, so the scanner
# fingerprints each episode's first ten and last five minutes
# (chromaprint via ffmpeg) and stores the stretches episodes have in
# common as skippable segments. Runs after new media settles, one season
# at a time; fingerprints are cached in the catalog, so only new or
# changed episodes are decoded. Chapter markers and .edl sidecars always
# take precedence over detection. On by default; the section is optional.
#[segments]
#auto = true
# ffmpeg for audio decoding; falls back to [enrich] ffmpeg_path, then "ffmpeg".
#ffmpeg_path = "ffmpeg"

# Run media-enrich automatically when new media is catalogued. The scanner
# waits for a quiet period after the last arrival (so a season drop is one
# run), keeps one run in flight, and never triggers on sidecar changes —
# except a changed .srt, which schedules a run so a corrected sidecar is
# re-embedded (sidecars written by a run itself do not count).
# media-enrich inherits the environment, so export TMDB_API_KEY before
# starting the scanner. Remove this section (or set auto = false) to keep
# enrichment manual.
[enrich]
auto = true
command = "media-enrich"
quiet_secs = 60
min_interval_secs = 600
# Also neutralize scene-filename titles embedded in MP4/MKV containers
# (players otherwise show them instead of the catalog title once playback
# starts). The one enrichment step that writes into media files — a
# header-only, in-place patch; opt-in.
strip_titles = true
# Embed a same-name .srt sidecar into MP4 files that have no subtitle
# stream (ffmpeg stream copy, mov_text track added; verified, then the
# file is replaced atomically). Replaces whole media files — opt-in.
embed_subtitles = true
# Extract the best embedded text subtitle track (full English captions,
# SDH preferred, "forced" foreign-parts-only tracks last) to a same-name
# .srt sidecar wherever one is missing, so every player has it and the
# web player needs no on-demand extraction. Only adds sidecars; on by
# default.
#extract_subtitles = true
# Films mastered far below everything else (a theatrical mix can sit 15 dB
# under a TV episode): measure the default audio track of newly arrived
# videos and, when it is well under the target and its peaks leave room,
# add a copy raised by a plain linear gain as the new default track, the
# original right behind it. Never compresses; files in the normal range
# are left alone. Replaces whole media files — opt-in.
#normalize_loudness = true
# "Newly arrived" = catalogued on or after this day (UTC). Unset: from the
# step's first run on. Older films one at a time: media-enrich --loudness-path.
#loudness_since = "2026-09-21"
# Raise towards this integrated loudness (LUFS), and only when the raise
# would be at least this many dB.
#loudness_target = -24.0
#loudness_min_gain = 4.0
#ffmpeg_path = "ffmpeg"

[[roots]]
path = "/mnt/media/Movies"
kind = "movies"

[[roots]]
path = "/mnt/media/Series"
kind = "tv"

[[roots]]
path = "/mnt/media/Audio"
kind = "music"
